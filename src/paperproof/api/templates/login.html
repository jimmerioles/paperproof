<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Paperproof</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <div class="auth-panel">
      <a class="brand auth-brand" href="/" aria-label="Paperproof home">
        <svg class="brand-mark" width="27" height="31" viewBox="0 0 27 31" fill="none" aria-hidden="true">
          <path d="M3.25 2.25h13.9l6.1 6.1v20.4H3.25z" stroke="currentColor" stroke-width="1.4"/>
          <path d="M17.15 2.25v6.1h6.1" stroke="currentColor" stroke-width="1.4"/>
          <path d="M7.25 12.5h9.5M7.25 16.5h12M7.25 20.5h7.5" stroke="currentColor" stroke-width="1.3" opacity=".5"/>
          <path d="M18.6 22.4h6.15v6.35H18.6z" fill="var(--red)"/>
        </svg>
        <span class="brand-name">Paperproof</span>
      </a>

      <div class="auth-card">
        <h1>Sign in</h1>
        <p class="auth-lede">Read the page, not the machine.</p>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        {% if not has_admin %}
        <div class="auth-note">
          <strong>No admin account yet.</strong>
          <span>Run this in the project directory, then reload the page.</span>
          <code class="auth-command">uv run paperproof auth set-password</code>
        </div>
        {% endif %}

        <form method="post" action="/login">
          <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
          <input type="hidden" name="next" value="{{ next }}">
          <div class="auth-field">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
          </div>
          <div class="auth-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary auth-submit" type="submit">Sign in</button>
        </form>
      </div>

      <p class="auth-foot">Every answer, page-checked.</p>
    </div>
  </main>
</body>
</html>

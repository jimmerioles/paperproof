<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="shell">
    <aside class="rail">
      <a class="brand" href="/" aria-label="Paperproof home">
        <svg class="brand-mark" width="27" height="31" viewBox="0 0 27 31" fill="none" aria-hidden="true">
          <path d="M3.25 2.25h13.9l6.1 6.1v20.4H3.25z" stroke="currentColor" stroke-width="1.4"/>
          <path d="M17.15 2.25v6.1h6.1" stroke="currentColor" stroke-width="1.4"/>
          <path d="M7.25 12.5h9.5M7.25 16.5h12M7.25 20.5h7.5" stroke="currentColor" stroke-width="1.3" opacity=".5"/>
          <path d="M18.6 22.4h6.15v6.35H18.6z" fill="var(--red)"/>
        </svg>
        <span class="brand-name">Paperproof</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a class="nav-link{% if active == 'documents' %} is-active{% endif %}" href="/">Documents</a>
        <a class="nav-link{% if active == 'search' %} is-active{% endif %}" href="/search">Search</a>
        <a class="nav-link{% if active == 'audit' %} is-active{% endif %}" href="/audit">Audit log</a>
      </nav>
      <div class="rail-foot">
        <span class="rail-note">Local review desk</span>
        <span class="rail-version">v0.1</span>
      </div>
    </aside>

    <main class="main" id="content">
      {% block content %}{% endblock %}
      <footer class="foot">
        <span>Paperproof. Every answer, page-checked.</span>
        <span><a href="/api/docs">API</a> / <a href="/healthz">Health</a></span>
      </footer>
    </main>
  </div>
  <script src="/static/app.js" defer></script>
</body>
</html>

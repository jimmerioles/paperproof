name: paperproof

services:
  app:
    build:
      context: .
    image: paperproof:${PAPERPROOF_TAG:-local}
    env_file:
      - .env
    environment:
      PAPERPROOF_ENV: prod
      PAPERPROOF_DATA_DIR: /app/data
    volumes:
      - paperproof_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  paperproof_data:
  caddy_data:
  caddy_config:

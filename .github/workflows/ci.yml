name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run paperproof eval
      - run: uv run paperproof restore-drill
      - run: docker build -t paperproof:ci .

  smoke:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Configure env
        run: |
          cat > .env <<EOF
          PAPERPROOF_ENV=prod
          PAPERPROOF_SESSION_SECRET=$(openssl rand -hex 32)
          PAPERPROOF_DATA_DIR=/app/data
          EOF

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -kfsS https://localhost:8443/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - name: Seed and create admin
        run: |
          docker compose exec -T app paperproof demo
          printf '%s\n' 'correct horse battery staple' | docker compose exec -T app paperproof auth set-password --password-stdin

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --frozen

      - name: Smoke
        env:
          SMOKE_BASE_URL: https://localhost:8443
          SMOKE_PASSWORD: correct horse battery staple
        run: uv run python scripts/smoke.py

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v

[project]
name = "paperproof"
version = "0.1.0"
description = "Document intelligence where every answer is page-checked."
readme = "README.md"
requires-python = ">=3.12"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE"]
authors = [{ name = "Paperproof" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "numpy>=2.1",
  "httpx>=0.27",
  "typer>=0.15",
  "rich>=13.9",
  "reportlab>=4.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "pyright>=1.1.390",
]

[project.scripts]
paperproof = "paperproof.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperproof"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/paperproof/samples.py" = ["E501"]

[tool.pyright]
include = ["src", "evals"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]
